spring.application.name=worker
server.port=10000
spring.threads.virtual.enabled=true

worker.location.processing=../test-data/processing
worker.location.failed.caching=../test-data/failed/worker/caching
worker.location.failed.transfer=../test-data/failed/worker/transfer
worker.location.completed=../test-data/completed


worker.queue.caching=file.processing.queue
worker.queue.transfer=file.transfer.queue
worker.rabbitmq.threads.caching=100
worker.rabbitmq.threads.transfer=25
worker.case.service.errorchance=1

spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=10
spring.rabbitmq.listener.simple.retry.initial-interval=60000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=900000ms

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=ib
spring.datasource.password=

# JPA / Hibernate indstillinger
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Aktiver H2 Web Console (kan tilgås på http://localhost:10000/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.amqp.deserialization.trust.all=true